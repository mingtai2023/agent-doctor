[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-doctor"
version = "0.1.0"
description = "Read-only agent memory diagnostics and explicit workspace boundaries"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "NovaMint Studio Limited"}]
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]

[project.urls]
Repository = "https://github.com/mingtai2023/agent-doctor"
Homepage = "https://nova-mint.store"

[project.scripts]
agent-doctor = "agent_doctor.diagnostic:main"

[tool.setuptools.packages.find]
where = ["src"]
